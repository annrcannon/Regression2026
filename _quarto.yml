project:
  type: website
  execute-dir: file
  render:
    - "*.qmd"
    - "!readme.md"
    - "!**/readme.md"
  resources:
    - "img/"
    - "www/"
  output-dir: docs
  
website:
  title: "STA 363 Advanced Regression"
  site-url: https://annrcannon.github.io/Regression2026/
  sidebar:
    background: "#BBBCBC"
    logo: "img/favicon.png" # This is where I put my hex
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/annrcannon/Regression2026
        text: "GitHub organization"
      - icon: code-square
        href: https://csgateway.cornellcollege.edu:8787
        text: "RStudio Server"
      - icon: book
        href: https://bookdown.org/roback/bookdown-BeyondMLR/
        text: "Book"
      - icon: person-fill
        text: "Moodle"
        href: https://moodle.cornellcollege.edu/course/view.php?id=9632
          

    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - section: "Course Contents"
        contents:
          - href: index.qmd
            text: Schedule & Assignments
          - href: course-links.qmd
            text: Useful links
          # - href: project.qmd
          #   text: Project
      #     - href: project/1-working-collaboratively.qmd
      #       text: Working Together Lab
            
      - section: "Course information"
        contents:
          - href: syllabus.qmd
            text: Syllabus
          - href: course-overview.qmd
            text: Overview
          - href: course-support.qmd
            text: Support
          - href: computing-access.qmd
            text: R/RStudio Access
     
  page-footer:
    left: "Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var instructor.name_no_title >}}]({{< var instructor.url >}})"
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})

  favicon: "/img/favicon.png"
    
format:
  html:
    theme:
      light: [united, style.scss]
      dark: [darkly, style.scss]
    toc: true
    highlight-style: monokai
    title-block-categories: true
    
    
execute:
  freeze: auto


    

